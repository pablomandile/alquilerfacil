<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sin conexión — Alquiler Fácil</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1rem;
                padding: 2rem;
                text-align: center;
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                color: #0d192b;
                background: #bfd6f3;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    color: #e8eef7;
                    background: #0d192b;
                }
            }
            img {
                width: 88px;
                height: 88px;
                border-radius: 20px;
            }
            h1 {
                font-size: 1.25rem;
                margin: 0;
            }
            p {
                margin: 0;
                max-width: 22rem;
                opacity: 0.8;
                line-height: 1.5;
            }
            button {
                margin-top: 0.5rem;
                padding: 0.6rem 1.4rem;
                border: 0;
                border-radius: 0.6rem;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
                color: #fff;
                background: #2743d8;
            }
        </style>
    </head>
    <body>
        <img src="/icons/icon-192.png?v=1" alt="Alquiler Fácil" />
        <h1>Sin conexión</h1>
        <p>
            No se pudo cargar la página. Revisá tu conexión a internet y volvé a
            intentar.
        </p>
        <button onclick="location.reload()">Reintentar</button>
    </body>
</html>
